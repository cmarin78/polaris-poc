; polaris POC — Grafana config.
;
; OIDC against Keycloak realm `polaris`, client `pol-grafana` (public client
; in the realm). Role mapping via Keycloak `groups` claim:
;   pol-admin      -> Admin
;   pol-ops        -> Editor
;   pol-eng        -> Viewer
;   pol-employees  -> Viewer
;   customer/partner groups -> Viewer

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000
domain = grafana.polaris.ts.net
root_url = http://grafana.polaris.ts.net

[security]
admin_user = admin
admin_password = polaris

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = pol-grafana
client_secret =
; We only request scopes that are realm defaults. The `profile` scope is
; optional (not a default), so requesting it directly causes Keycloak to
; reject with invalid_scope. The `groups` and `email` scopes are
; automatically added via realm defaultDefaultClientScopes.
scopes = openid email
empty_scopes = false
email_attribute_name = email
login_attribute_path = preferred_username
name_attribute_path = preferred_username
; groups is an array; Grafana's role_attribute_path syntax (JMESPath) extracts
; the first matching role.
role_attribute_path = contains(groups[*], 'pol-admin') && 'Admin' || contains(groups[*], 'pol-ops') && 'Editor' || 'Viewer'
role_attribute_strict = false
allow_assign_grafana_admin = true

; Token endpoint, auth endpoint, etc. derived from the discovery URL below.
; Grafana only resolves .well-known/openid-configuration on this URL.
auth_url = http://keycloak:8080/realms/polaris/protocol/openid-connect/auth
token_url = http://keycloak:8080/realms/polaris/protocol/openid-connect/token
api_url = http://keycloak:8080/realms/polaris/protocol/openid-connect/userinfo

[log]
level = info