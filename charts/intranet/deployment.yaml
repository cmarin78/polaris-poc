# polaris POC — Intranet portal deployment.
#
# Run with:
#   kubectl --context=kind-polaris-eks-sim apply -f charts/intranet/deployment.yaml
#
# This manifest references the polaris-intranet image that was built
# locally with `docker build -t polaris-intranet:latest apps/intranet/`.
# For the kind cluster to pull it, the image must be loaded into the
# cluster nodes:
#   kind load docker-image polaris-intranet:latest --name polaris-eks-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet
  namespace: pol-intranet
  labels:
    app: intranet
    tier: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intranet
  template:
    metadata:
      labels:
        app: intranet
    spec:
      containers:
        - name: intranet
          image: polaris-intranet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: KEYCLOAK_ISSUER
              value: "http://keycloak:8080/realms/polaris"
            - name: KEYCLOAK_CLIENT_ID
              value: "pol-intranet"
            - name: KEYCLOAK_CLIENT_SECRET
              value: ""
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "pol_intranet"
            - name: POSTGRES_USER
              value: "polaris_admin"
            - name: POSTGRES_PASSWORD
              value: "polaris"
            - name: PUBLIC_URL
              value: "http://intranet.polaris.ts.net"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: intranet
  namespace: pol-intranet
  labels:
    app: intranet
spec:
  type: ClusterIP
  selector:
    app: intranet
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Ingress so the intranet is reachable from the host (and from outside
# if there's a DNS forwarder). For the POC we use a NodePort service
# in front; the production setup would use a real domain + TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intranet
  namespace: pol-intranet
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: intranet.polaris.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intranet
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: intranet-nodeport
  namespace: pol-intranet
spec:
  type: NodePort
  selector:
    app: intranet
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081